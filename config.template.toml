# PM-Bot Configuration Template
# Copy to config.toml and fill in your values

[mode]
# paper: Paper trading (no real money)
# live: Live trading (real money!)
mode = "paper"

[sizing]
bankroll = 100.0
kelly_fraction = 0.25
max_single = 50.0
max_daily = 200.0
max_per_city = 100.0
max_total_pct = 0.30

[strategy.gopfan2]
# Tail-YES lottery tickets (mid <= $0.15)
yes_max = 0.15
no_min = 0.45
kelly_fraction = 0.25
max_single_pct = 0.02
max_position_usd = 2.0

[strategy.forecast_arb]
# Model vs market mispricing exploit
min_mispricing = 0.15
min_model_prob = 0.05
max_market_price = 0.30
kelly_fraction = 0.25
max_single_pct = 0.02
max_position_usd = 2.0

[strategy.emos_gopfan2]
# EMOS-enhanced gopfan2 (model-validated tails)
yes_max = 0.15
min_model_prob = 0.18
edge_threshold = 0.08
kelly_fraction = 0.25
max_single_pct = 0.02
max_position_usd = 2.0

[strategy.emos_forecast_arb]
# EMOS-enhanced forecast arb (calibrated probabilities)
min_mispricing = 0.15
min_model_prob = 0.05
max_market_price = 0.30
kelly_fraction = 0.25
max_single_pct = 0.02
max_position_usd = 2.0

[strategy.barbell]
# ColdMath-style barbell: tail buys + high-conviction central bets
edge_threshold = 0.08
kelly_fraction = 0.15
max_single_pct = 0.02
max_position_usd = 5.0
tail_ratio = 0.80

[strategy.adaptive_barbell]
# Adaptive barbell with dynamic ratio adjustment
edge_threshold = 0.08
kelly_fraction = 0.15
max_single_pct = 0.02
max_position_usd = 5.0

[daemon]
# Daemon configuration
cities = [
    "Chicago",
    "Miami",
    "Buenos Aires",
    "Cape Town",
    "Lagos",
    "Atlanta",
    "Dallas",
    "Wellington",
]
scan_interval = 300  # 5 minutes
heartbeat_path = "~/.pm-bot/heartbeat"
paper_db_path = "~/.pm-bot/paper_trades.db"

[risk]
# Risk management
circuit_breaker_l1 = 0.05  # 5% daily loss → half Kelly
circuit_breaker_l2 = 0.10  # 10% daily loss → quarter Kelly
circuit_breaker_l3 = 0.15  # 15% daily loss → stop trading
no_new_position_before_resolution_h = 6
consecutive_loss_pause_count = 5
consecutive_loss_pause_minutes = 60
max_spread = 0.10

[notifications]
# Notification settings
discord_webhook = ""
telegram_bot_token = ""
telegram_chat_id = ""

[clob]
# Polymarket CLOB API credentials
# Get from: https://docs.polymarket.com/
clob_api_key = ""
clob_secret = ""
clob_pass_phrase = ""
poly_pk = ""  # Polygon private key

[dune]
# Dune Analytics API (optional, for historical prices)
dune_api_key = ""

[smart_wallet]
# Smart wallet copy-trading configuration
enabled = true
scan_interval = 30  # seconds
min_trade_size = 5.0  # USD
max_trade_age_min = 60  # minutes
signal_cooldown_min = 30  # minutes
# Kelly fraction for smart wallet trades
kelly_fraction = 0.15
# Max position per signal
max_position_usd = 5.0
