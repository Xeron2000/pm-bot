[project]
name = "pm-bot"
version = "0.1.0"
description = "Polymarket weather market strategy scanner CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "cachetools>=5.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "py-clob-client-v2>=1.0.0",
    "pydantic>=2.0",
    "poly-web3>=2.0.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "structlog>=24.0",
    "tomlkit>=0.13",
    "typer>=0.12",
    "websockets>=12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.11",
]

[tool.uv]
package = true

[project.scripts]
pm-bot = "pm_bot.cli.app:app"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 120
